name: Validate application
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install application and research dependencies
        run: |
          if [ '${{ matrix.python }}' = '3.12' ]; then
            python -m pip install --require-hashes --only-binary :all: -r requirements.lock
            python -m pip install --no-deps .
          else
            python -m pip install '.[research]'
          fi
      - run: sh -n start
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_release.py
      - run: python -m genetics_app demo --out /tmp/genetics-demo
      - name: Compare synthetic indels with bcftools
        if: matrix.python == '3.12'
        run: python -m tools.validate_indels --out /tmp/normalization-validation.json
